# Crea una release de GitHub al subir un tag v* (por ejemplo v1.0.0).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir paquetes
        run: ./packaging/build-deb.sh
      - name: Crear release con .deb y tarball
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
